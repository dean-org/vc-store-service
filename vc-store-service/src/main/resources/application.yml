server:
  port: 8095
  servlet:
    context-path: /v1/vault

spring:
  application:
    name: vc-store-service
  datasource:
    url: jdbc:postgresql://${VAULT_DB_HOST:localhost}:${VAULT_DB_PORT:5444}/${VAULT_DB_NAME:vc_vault}
    username: ${VAULT_DB_USER:postgres}
    password: ${VAULT_DB_PASSWORD:postgres}
  jackson:
    default-property-inclusion: non_null

vault:
  # Public URL of THIS service as wallets/Mimoto reach it (ends with the context path)
  public-base-url: ${VAULT_PUBLIC_BASE_URL:http://localhost:8095/v1/vault}
  # Base64 of 32 bytes. MUST be the same value as Certify's mosip.certify.vc-vault.encryption-key.
  encryption-key: ${VAULT_ENCRYPTION_KEY:WNTp9yniBPweH5btOPYU9GzmIEbTZAnIrtGfDhbLSEY=}
  # Shared secret the eSignet plugin sends as X-Internal-Key on /internal/**. Required.
  internal-api-key: ${VAULT_INTERNAL_API_KEY:13dfb58dd38100e40f95e3828130413ae8b70752468b7051570dbad0d40b8164}
  oidc:
    # eSignet: `iss` of its access tokens, and its JWKS
    issuer-uri: ${VAULT_OIDC_ISSUER_URI:https://esignet.demo.idencode.link/.well-known/openid-configuration}
    jwk-set-uri: ${VAULT_OIDC_JWK_SET_URI:https://esignet.demo.idencode.link/.well-known/jwks.json}
    # Whatever eSignet puts in `aud` of the access token (comma separated)
    allowed-audiences: ${VAULT_OIDC_ALLOWED_AUDIENCES:https://esignet.demo.idencode.link/v1/esignet/vci/credential}
  otp:
    length: 6
    ttl-seconds: 300
    max-attempts: 5
    resend-after-seconds: 30
    max-sends-per-hour: 5
    hash-pepper: ${VAULT_OTP_PEPPER:7ecdda7d2889494e5907a316a12ea3722c7ee6009b248815c95546f3e3d4589d}
    message-template: "Your credential download code is %s. It expires in %d minutes."
    sender:
      type: ${VAULT_OTP_SENDER:log}          # log | http
      log-otp: ${VAULT_OTP_LOG_PLAINTEXT:false}   # DEV ONLY: writes the OTP itself to the log
      url: ${VAULT_OTP_SENDER_URL:}
      auth-token: ${VAULT_OTP_SENDER_TOKEN:}
    # Used when the credential has a registered email; otherwise the OTP goes by SMS (sender above).
    email:
      type: ${VAULT_OTP_EMAIL_TYPE:smtp}          # smtp | log (log delivers nothing: dev only)
      log-otp: ${VAULT_OTP_EMAIL_LOG_PLAINTEXT:false}
      from: ${VAULT_MAIL_FROM:injitf01@gmail.com}
      subject: "Your credential download code"
      body-template: "Your credential download code is %s. It expires in %d minutes.\n\nIf you did not ask for this code, you can ignore this email."
      smtp:
        host: ${VAULT_SMTP_HOST:smtp.gmail.com}
        port: ${VAULT_SMTP_PORT:587}
        username: ${VAULT_SMTP_USERNAME:injitf01@gmail.com}
        password: ${VAULT_SMTP_PASSWORD:ygpy proz asck cbrk}
        auth: ${VAULT_SMTP_AUTH:true}
        starttls: ${VAULT_SMTP_STARTTLS:true}
        ssl: ${VAULT_SMTP_SSL:false}
  credential:
    max-downloads: 0                        # 0 = unlimited, N = at most N downloads per credential
  metadata:
    # Certify's /.well-known/openid-credential-issuer saved as a file; we override the endpoints.
    template-path: ${VAULT_METADATA_TEMPLATE:/config/issuer-metadata.json}

management:
  endpoints:
    web:
      exposure:
        include: health
