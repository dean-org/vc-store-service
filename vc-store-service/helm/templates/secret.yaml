apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vc-store-service.fullname" . }}-secret
  labels:
    {{- include "vc-store-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.springDatasourcePassword | quote }}
